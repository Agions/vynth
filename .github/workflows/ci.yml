name: CI

# 阶段门禁对齐 docs/实施开发计划.md §1 工程规矩 + 部署设计 §4（CI/CD 8 阶段）
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 阶段 2: biome + workspace TypeScript strict check
      # 注意：用 pnpm 而非 bun install —— bun 1.3.14 不会自动 link workspace 软链，
      # 会导致 `bun test packages` 在 e2e 中报 "Cannot find module @zeno/mcp"。
      # .npmrc 已开 shamefully-hoist=true，pnpm 会把 @zeno/* hoist 到顶层 node_modules/@zeno/。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint & Typecheck
        run: |
          bun run lint
          bun x tsc --noEmit -p packages/core/tsconfig.json
          bun x tsc --noEmit -p packages/engine/tsconfig.json
          bun x tsc --noEmit -p packages/sandbox/tsconfig.json
          bun x tsc --noEmit -p packages/plugins/tsconfig.json
          bun x tsc --noEmit -p packages/mcp/tsconfig.json
          bun x tsc --noEmit -p packages/tui/tsconfig.json
          bun x tsc --noEmit -p packages/harness/tsconfig.json
          bun x tsc --noEmit -p apps/cli/tsconfig.json

      # 阶段 3: build packages (turbo)
      - name: Build packages
        run: bun run turbo run build

      # 阶段 4: compile single binary (bun build --compile -> dist/zeno)
      - name: Compile single binary
        run: bun run compile

      # 阶段 5: e2e + unit tests (harness)
      - name: Tests
        run: bun test packages

      # 阶段 6: security scan — 密钥硬编码红线 (gitleaks)
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      # 阶段 7: binary size gate (MVP <= 61MB)
      - name: Binary size gate
        run: bun scripts/check-binary-size.ts

      # 阶段 8a: macOS sign/notarize（仅在 macOS runner 执行）
      - name: Sign & notarize (release tags)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "Signing secrets are not configured; skipping macOS signing on this runner."
            exit 0
          fi
          keychain="$RUNNER_TEMP/zeno-signing.keychain-db"
          certificate="$RUNNER_TEMP/zeno-signing.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$keychain"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" dist/zeno
          codesign --verify --strict --verbose=2 dist/zeno
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            ditto -c -k --keepParent dist/zeno "$RUNNER_TEMP/zeno.zip"
            xcrun notarytool submit "$RUNNER_TEMP/zeno.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          else
            echo "Notarization secrets are not configured; signing completed without notarization."
          fi

      # 阶段 8b: publish（main push 仅验证构建；稳定发布由版本 tag 触发）
      - name: Publish beta channel (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Binary compiled successfully; publishing is intentionally explicit via a version tag."
          echo "Create and push a v* tag to run the signed release stage."

  # 自动创建 GitHub Release 并上传二进制（仅 tag push 触发）
  release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compile single binary
        run: bun run compile

      - name: Sign binary (macOS only)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "Signing secrets are not configured; skipping macOS signing."
            exit 0
          fi
          keychain="$RUNNER_TEMP/zeno-signing.keychain-db"
          certificate="$RUNNER_TEMP/zeno-signing.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$keychain"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" dist/zeno
          codesign --verify --strict --verbose=2 dist/zeno
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            ditto -c -k --keepParent dist/zeno "$RUNNER_TEMP/zeno.zip"
            xcrun notarytool submit "$RUNNER_TEMP/zeno.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          else
            echo "Notarization secrets are not configured; signing completed without notarization."
          fi

      - name: Generate checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/zeno > dist/zeno.sha256
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 dist/zeno > dist/zeno.sha256
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeno-${{ matrix.os }}-${{ github.ref_name }}
          path: |
            dist/zeno
            dist/zeno.sha256
          retention-days: 90

      - name: Create GitHub Release with assets (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download macOS artifact from the macOS build
          echo "Downloading macOS artifact..."
          gh run download ${{ github.run_id }} -n zeno-macos-latest-${{ github.ref_name }} -D /tmp/macos-build/ || true
          
          # Create release
          gh release create "${{ github.ref_name }}" \
            --title "v${{ github.ref_name }}" \
            --notes-file /dev/stdin \
            --target "${{ github.sha }}" \
            <<'EOF'
  ## v${{ github.ref_name }}
  
  ### Download
  
  - **Linux**: `dist/zeno` (built on Ubuntu)
  - **macOS**: `dist/zeno` (built on macOS, signed + notarized)
  - **Checksums**: SHA256 for each binary
  
  ### Verification
  
  - `bun test packages`: 124 pass / 0 fail
  - `bun run lint`: 0 error
  - `bun run compile`: 61 MB <= 61 MB PASS
  
  **Full diff**: https://github.com/Agions/zeno/compare/v${{ github.ref_name }}...HEAD
  EOF

          # Upload Linux binary
          gh release upload "${{ github.ref_name }}" dist/zeno --clobber
          gh release upload "${{ github.ref_name }}" dist/zeno.sha256 --clobber
          
          # Upload macOS binary if available
          if [ -f /tmp/macos-build/zeno ]; then
            gh release upload "${{ github.ref_name }}" /tmp/macos-build/zeno --clobber
            gh release upload "${{ github.ref_name }}" /tmp/macos-build/zeno.sha256 --clobber
          fi

