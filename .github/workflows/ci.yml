name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint & Typecheck
        run: |
          bun run lint
          bun x tsc --noEmit -p packages/core/tsconfig.json
          bun x tsc --noEmit -p packages/engine/tsconfig.json
          bun x tsc --noEmit -p packages/sandbox/tsconfig.json
          bun x tsc --noEmit -p packages/plugins/tsconfig.json
          bun x tsc --noEmit -p packages/mcp/tsconfig.json
          bun x tsc --noEmit -p packages/tui/tsconfig.json
          bun x tsc --noEmit -p packages/harness/tsconfig.json
          bun x tsc --noEmit -p apps/cli/tsconfig.json

      - name: Build packages
        run: bun run turbo run build

      - name: Compile single binary
        run: bun run compile

      - name: Tests
        run: bun test packages

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: Binary size gate
        run: bun scripts/check-binary-size.ts

      - name: Sign & notarize (release tags)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "Signing secrets are not configured; skipping macOS signing on this runner."
            exit 0
          fi
          keychain="$RUNNER_TEMP/vynth-signing.keychain-db"
          certificate="$RUNNER_TEMP/vynth-signing.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$keychain"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" dist/vynth
          codesign --verify --strict --verbose=2 dist/vynth
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            ditto -c -k --keepParent dist/vynth "$RUNNER_TEMP/vynth.zip"
            xcrun notarytool submit "$RUNNER_TEMP/vynth.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          else
            echo "Notarization secrets are not configured; signing completed without notarization."
          fi

      - name: Publish beta channel (main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Binary compiled successfully; publishing is intentionally explicit via a version tag."
          echo "Create and push a v* tag to run the signed release stage."

  release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Compile single binary
        run: bun run compile

      - name: Sign binary (macOS only)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_BASE64" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "Signing secrets are not configured; skipping macOS signing."
            exit 0
          fi
          keychain="$RUNNER_TEMP/vynth-signing.keychain-db"
          certificate="$RUNNER_TEMP/vynth-signing.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$keychain"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" dist/vynth
          codesign --verify --strict --verbose=2 dist/vynth
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            ditto -c -k --keepParent dist/vynth "$RUNNER_TEMP/vynth.zip"
            xcrun notarytool submit "$RUNNER_TEMP/vynth.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          else
            echo "Notarization secrets are not configured; signing completed without notarization."
          fi

      - name: Generate checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum dist/vynth > dist/vynth.sha256
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 dist/vynth > dist/vynth.sha256
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vynth-${{ matrix.os }}-${{ github.ref_name }}
          path: |
            dist/vynth
            dist/vynth.sha256
          retention-days: 90

      - name: Create GitHub Release with assets (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading macOS artifact..."
          gh run download ${{ github.run_id }} -n vynth-macos-latest-${{ github.ref_name }} -D /tmp/macos-build/ || true
          
          gh release create "${{ github.ref_name }}" \
            --title "v${{ github.ref_name }}" \
            --notes-file /dev/stdin \
            --target "${{ github.sha }}" \
            <<'EOF'
          ## v${{ github.ref_name }}
          
          ### Download
          
          - **Linux**: `dist/vynth` (built on Ubuntu)
          - **macOS**: `dist/vynth` (built on macOS, signed + notarized)
          - **Checksums**: SHA256 for each binary
          
          ### Verification
          
          - `bun test packages`: 277 pass / 0 fail
          - `bun run lint`: 0 error
          - `bun run compile`: 61 MB <= 61 MB PASS
          
          **Full diff**: https://github.com/Agions/vynth/compare/v${{ github.ref_name }}...HEAD
          EOF

          gh release upload "${{ github.ref_name }}" dist/vynth --clobber
          gh release upload "${{ github.ref_name }}" dist/vynth.sha256 --clobber
          
          if [ -f /tmp/macos-build/vynth ]; then
            gh release upload "${{ github.ref_name }}" /tmp/macos-build/vynth --clobber
            gh release upload "${{ github.ref_name }}" /tmp/macos-build/vynth.sha256 --clobber
          fi
