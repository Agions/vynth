name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy -- -D warnings -A dead_code

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release

      - name: Check binary size
        shell: bash
        run: |
          SIZE=$(du -sh target/release/synerix | cut -f1)
          echo "📦 Binary size: $SIZE"
          echo "binary_size=$SIZE" >> $GITHUB_ENV

      - name: Benchmark startup
        shell: bash
        run: |
          START=$(date +%s%N)
          target/release/synerix --version 2>/dev/null || true
          END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          echo "⚡ Startup: ${MS}ms"
          echo "startup_ms=$MS" >> $GITHUB_ENV

      - name: Upload binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: synerix-linux-amd64
          path: target/release/synerix
          retention-days: 7

  release:
    name: Release
    needs: [check, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: synerix-linux-amd64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: synerix
