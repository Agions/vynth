name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --all-targets 2>&1

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --workspace -- -D warnings 2>&1

      - name: cargo doc
        run: cargo doc --no-deps --document-private-items 2>&1

      - name: cargo audit
        run: |
          cargo install cargo-audit --locked 2>/dev/null
          cargo audit

      - name: Check naming conventions
        shell: bash
        run: |
          # Check snake_case .rs files in crates/ and src/
          NON_SNAKE=$(find crates src -name "*.rs" 2>/dev/null | grep -E '[A-Z]' || true)
          if [ -n "$NON_SNAKE" ]; then
            echo "❌ Non-snake_case .rs files found:"
            echo "$NON_SNAKE"
            exit 1
          fi
          echo "✅ All file names are snake_case"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Install ripgrep
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ripgrep
          fi
          rg --version

      - name: Run tests
        run: cargo test --all-targets --workspace 2>&1

      - name: Release build
        run: cargo build --release --workspace 2>&1

      - name: Check binary size
        shell: bash
        run: |
          SIZE=$(du -sh target/release/synerix | cut -f1)
          echo "📦 Binary size: $SIZE"

      - name: Benchmark startup
        shell: bash
        run: |
          START=$(date +%s%N)
          target/release/synerix --version 2>/dev/null || true
          END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          echo "⚡ Startup: ${MS}ms"

      - name: Upload binary
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: synerix-linux-amd64
          path: target/release/synerix
          retention-days: 7

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --workspace --out Lcov --output-dir ./coverage

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: ./coverage/lcov.info

  release:
    name: Release
    needs: [check, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: synerix-linux-amd64

      - name: Package binary
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          tar czf "synerix-${TAG}-linux-amd64.tar.gz" synerix
          echo "tag=$TAG" >> $GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: synerix-${{ env.tag }}-linux-amd64.tar.gz
