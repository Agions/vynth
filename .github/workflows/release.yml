name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --workspace

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/synerix dist/ 2>/dev/null || cp target/release/synerix.exe dist/ 2>/dev/null || true
          cp README.md LICENSE dist/ 2>/dev/null || true
          tar -czf synerix-${{ runner.os }}-${{ github.ref_name }}.tar.gz -C dist .

      - name: Upload release artifact
        uses: softprops/action-gh-release@v1
        with:
          files: synerix-*.tar.gz
          generate_release_notes: true