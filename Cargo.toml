[workspace]
resolver = "2"
members = [
    "crates/synerix",
    "crates/synerix-core",
    "benches/bench_runner",
]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "fs", "io-util", "net"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"
serde_yaml = "0.9"
async-stream = "0.3"
async-trait = "0.1"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
criterion = { version = "0.5" }
moka = { version = "0.12", features = ["sync"] }
memchr = "2"

[workspace.dependencies.tempfile]
version = "3"

[workspace.dependencies.serial_test]
version = "3"

[workspace.lints.clippy]
# Selected pedantic lints that improve code quality
single_match = "warn"
redundant_clone = "warn"
needless_borrow = "warn"
needless_pass_by_value = "warn"
map_unwrap_or = "warn"
unnecessary_literal_unwrap = "warn"
manual_filter_map = "warn"
manual_find_map = "warn"
unnecessary_wraps = "warn"
match_same_arms = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
