<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Primary gradient: deep cyan → violet → pink -->
    <linearGradient id="mg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="35%" stop-color="#7B61FF"/>
      <stop offset="70%" stop-color="#C678DD"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <!-- Secondary gradient: green → cyan -->
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <!-- Ambient radial glow -->
    <radialGradient id="ambient1" cx="12%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient2" cx="85%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft glow filter -->
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Window shadow -->
    <filter id="win-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- Title bar gradient -->
    <linearGradient id="termTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24283B"/>
      <stop offset="100%" stop-color="#1A1B2E"/>
    </linearGradient>
    <!-- Status bar gradient -->
    <linearGradient id="status-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2030"/>
      <stop offset="100%" stop-color="#181A28"/>
    </linearGradient>
  </defs>

  <!-- ═══════ BACKGROUND LAYERS ═══════ -->
  <rect width="1200" height="400" rx="20" fill="#0D1117"/>
  <rect width="1200" height="400" rx="20" fill="url(#ambient1)"/>
  <rect width="1200" height="400" rx="20" fill="url(#ambient2)"/>
  <!-- Dot grid -->
  <g fill="#FFFFFF" opacity="0.03">
    <circle cx="50" cy="50" r="1.2"/><circle cx="100" cy="50" r="1.2"/><circle cx="150" cy="50" r="1.2"/><circle cx="200" cy="50" r="1.2"/><circle cx="250" cy="50" r="1.2"/>
    <circle cx="950" cy="50" r="1.2"/><circle cx="1000" cy="50" r="1.2"/><circle cx="1050" cy="50" r="1.2"/><circle cx="1100" cy="50" r="1.2"/><circle cx="1150" cy="50" r="1.2"/>
    <circle cx="50" cy="350" r="1.2"/><circle cx="100" cy="350" r="1.2"/><circle cx="150" cy="350" r="1.2"/>
    <circle cx="1050" cy="350" r="1.2"/><circle cx="1100" cy="350" r="1.2"/><circle cx="1150" cy="350" r="1.2"/>
    <circle cx="600" cy="380" r="1.2"/><circle cx="650" cy="380" r="1.2"/><circle cx="700" cy="380" r="1.2"/><circle cx="750" cy="380" r="1.2"/>
  </g>
  <!-- Hairline border -->
  <rect x="1" y="1" width="1198" height="398" rx="19" fill="none" stroke="#1E2030" stroke-width="1.5"/>

  <!-- ═══════ LEFT: MONOGRAM + BRANDING ═══════ -->
  <g transform="translate(130, 110)" filter="url(#soft)">
    <!-- ">" chevron cursor -->
    <path d="M-50,-50 L-14,0 L-50,50"
          fill="none" stroke="url(#mg)" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- "_" underscore cursor -->
    <path d="M-50,76 L50,76"
          fill="none" stroke="url(#sg)" stroke-width="10"
          stroke-linecap="round" opacity="0.92"/>
    <!-- "S" flowing letterform -->
    <path d="M2,-56 C48,-56 66,-24 36,-2 C10,16 -8,14 -6,32 C-4,50 30,56 62,40"
          fill="none" stroke="url(#mg)" stroke-width="12"
          stroke-linecap="round"/>
  </g>
  <!-- Cursor dot glow -->
  <circle cx="130" cy="110" r="4" fill="#00FF88" opacity="0.85" filter="url(#glow)"/>

  <!-- Wordmark -->
  <text x="130" y="225" text-anchor="middle"
        font-family="'SF Pro Display','Inter','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="42" font-weight="800" letter-spacing="11" fill="#F0F6FC" filter="url(#glow)">
    SYNERIX
  </text>
  <!-- Tagline -->
  <text x="130" y="252" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',monospace"
        font-size="11.5" letter-spacing="5" fill="#7B8EA8">
    AI-NATIVE CODING TERMINAL
  </text>

  <!-- Feature pills -->
  <g transform="translate(130, 278)" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10" font-weight="600">
    <g transform="translate(-110, 0)">
      <rect width="58" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="29" y="16" text-anchor="middle" fill="#DEA584">⚙ Rust</text>
    </g>
    <g transform="translate(-42, 0)">
      <rect width="62" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="31" y="16" text-anchor="middle" fill="#7DCFFF">◆ TUI</text>
    </g>
    <g transform="translate(32, 0)">
      <rect width="66" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="33" y="16" text-anchor="middle" fill="#7EE787">⚡ 2.8 MB</text>
    </g>
    <g transform="translate(110, 0)">
      <rect width="84" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="42" y="16" text-anchor="middle" fill="#F7768E">✓ 1342 tests</text>
    </g>
  </g>

  <!-- ═══════ RIGHT: TUI MOCKUP WINDOW ═══════ -->
  <g transform="translate(520, 30)" filter="url(#win-shadow)">
    <rect width="640" height="340" rx="16" fill="#1A1B26" stroke="#2A2E45" stroke-width="1.5"/>

    <!-- Title Bar -->
    <path d="M0,14 a14,14 0 0 1 14,-14 h612 a14,14 0 0 1 14,14 v24 h-640 z" fill="url(#termTop)"/>
    <circle cx="20" cy="15" r="6" fill="#FF5F56" opacity="0.9"/>
    <circle cx="42" cy="15" r="6" fill="#FFBD2E" opacity="0.9"/>
    <circle cx="64" cy="15" r="6" fill="#27C93F" opacity="0.9"/>
    <text x="320" y="19" text-anchor="middle"
          font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#6B7394">
      ◆ Synerix — AI-Native Coding Terminal
    </text>

    <!-- Sidebar -->
    <g transform="translate(12, 50)">
      <rect width="138" height="256" rx="8" fill="none" stroke="#2A2E45" stroke-width="1"/>
      <text x="12" y="16" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#7DCFFF" font-weight="700">📁 Files</text>
      <text x="58" y="16" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#69708C">Sessions</text>
      <line x1="12" y1="24" x2="126" y2="24" stroke="#2A2E45" stroke-width="0.8"/>
      <text x="12" y="40" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9EAFD0">📁 src</text>
      <text x="24" y="54" font-family="'JetBrains Mono',monospace" font-size="9" fill="#E0E6F0">main.rs</text>
      <text x="24" y="68" font-family="'JetBrains Mono',monospace" font-size="9" fill="#69708C">lib.rs</text>
      <text x="12" y="82" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9EAFD0">📁 crates</text>
      <text x="24" y="96" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF">synerix</text>
      <text x="24" y="110" font-family="'JetBrains Mono',monospace" font-size="9" fill="#69708C">Cargo.toml</text>
      <text x="24" y="124" font-family="'JetBrains Mono',monospace" font-size="9" fill="#C0CAF5">agent_loop.rs</text>
      <text x="12" y="138" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9EAFD0">📁 docs</text>
      <text x="24" y="152" font-family="'JetBrains Mono',monospace" font-size="9" fill="#69708C">index.md</text>
      <!-- Active highlights -->
      <rect x="10" y="48" width="118" height="14" rx="4" fill="#7DCFFF" opacity="0.08"/>
      <rect x="10" y="118" width="118" height="14" rx="4" fill="#7DCFFF" opacity="0.05"/>
    </g>

    <!-- Main Chat Panel -->
    <g transform="translate(162, 50)">
      <rect width="466" height="200" rx="8" fill="none" stroke="#2A2E45" stroke-width="1"/>
      <text x="12" y="16" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#7DCFFF" font-weight="700">💬 Chat</text>
      <line x1="12" y1="24" x2="454" y2="24" stroke="#2A2E45" stroke-width="0.8"/>

      <!-- AI response -->
      <text x="12" y="44" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9ECE6A" font-weight="700">◆ AI</text>
      <text x="34" y="44" font-family="'JetBrains Mono',monospace" font-size="9" fill="#C0CAF5">Refactoring handler_common_key with pattern matching…</text>

      <!-- Code diff block -->
      <g transform="translate(12, 52)">
        <rect width="442" height="52" rx="6" fill="#0D1117" stroke="#2A2E45" stroke-width="0.5"/>
        <text x="8" y="14" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#69708C">─── src/handler.rs:24-32 ───</text>
        <text x="8" y="30" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9ECE6A">+ pub fn handle_common_key(k: KeyEvent) {</text>
        <text x="8" y="44" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9ECE6A">+     match k.code {</text>
        <text x="22" y="58" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9ECE6A">+         Enter => submit(), _ => {} }</text>
        <text x="8" y="72" font-family="'JetBrains Mono',monospace" font-size="9" fill="#F7768E">- fn handle_key(k: KeyCode) { ... }</text>
      </g>

      <!-- User message -->
      <text x="12" y="140" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF" font-weight="700">▸ user</text>
      <text x="42" y="140" font-family="'JetBrains Mono',monospace" font-size="9" fill="#C0CAF5">合并那两处重复的 key handler</text>

      <!-- Tool call indicator -->
      <text x="12" y="156" font-family="'JetBrains Mono',monospace" font-size="9" fill="#FFB454">⚙ edit(src/handler.rs)</text>
      <text x="120" y="156" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7EE787">✓ compiled</text>

      <!-- Input bar -->
      <g transform="translate(0, 170)">
        <rect width="466" height="26" rx="8" fill="#0D1117" stroke="#3A3F5C" stroke-width="1"/>
        <text x="12" y="17" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#9ECE6A" font-weight="700">⌨</text>
        <text x="26" y="17" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#69708C">describe → generate → test → fix</text>
        <rect x="378" y="6" width="2" height="14" rx="1" fill="#00D4FF" opacity="0.95">
          <animate attributeName="opacity" values="0.95;0.1;0.95" dur="1.2s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Diff / Preview Panel -->
    <g transform="translate(162, 262)">
      <rect width="466" height="68" rx="8" fill="none" stroke="#2A2E45" stroke-width="1"/>
      <text x="12" y="14" font-family="'JetBrains Mono',monospace" font-size="9" fill="#C0CAF5" font-weight="700">📄 diff preview</text>
      <line x1="12" y1="20" x2="454" y2="20" stroke="#2A2E45" stroke-width="0.8"/>
      <text x="12" y="36" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#9ECE6A">+ // Merged duplicate key handlers</text>
      <text x="12" y="48" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#9ECE6A">+ pub fn handle_common_key(k: KeyEvent) {</text>
      <text x="12" y="60" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#9ECE6A">+     match k.code { Enter => submit(), _ => {} }</text>
    </g>

    <!-- Status Bar -->
    <g transform="translate(12, 318)">
      <rect width="616" height="18" rx="5" fill="url(#status-bg)" stroke="#2A2E45" stroke-width="0.8"/>
      <rect x="4" y="2" width="56" height="14" rx="7" fill="#507882"/>
      <text x="32" y="11" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#DCEEFF" font-weight="700">📋 Plan</text>
      <text x="66" y="11" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#69708C">│</text>
      <text x="76" y="11" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#9ECE6A">● Idle</text>
      <text x="114" y="11" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#69708C">│</text>
      <text x="124" y="11" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#A0AAD2">deepseek-v4</text>
      <text x="190" y="11" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#69708C">│</text>
      <text x="200" y="11" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#FFB454">⚡ sandbox auto</text>
      <text x="280" y="11" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#69708C">│</text>
      <text x="290" y="11" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#8B949E">tok</text>
      <rect x="314" y="5" width="80" height="8" rx="4" fill="#161B22"/>
      <rect x="314" y="5" width="52" height="8" rx="4" fill="#7DCFFF" opacity="0.6"/>
      <text x="398" y="11" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#8B949E">6.5k / 128k</text>
      <text x="548" y="11" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#7DCFFF">◆ Synerix</text>
    </g>
  </g>

  <!-- ═══════ BOTTOM STATS BAR ═══════ -->
  <g transform="translate(130, 355)" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10" fill="#565C74">
    <text x="0" y="14">◆ Built with Rust</text>
    <text x="140" y="14" fill="#3A3F5C">│</text>
    <text x="155" y="14">ratatui + crossterm</text>
    <text x="305" y="14" fill="#3A3F5C">│</text>
    <text x="320" y="14">MIT License</text>
    <text x="400" y="14" fill="#3A3F5C">│</text>
    <text x="415" y="14">github.com/Agions/synerix</text>
  </g>
</svg>
