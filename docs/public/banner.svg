<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="gm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="40%" style="stop-color:#7B61FF"/>
      <stop offset="100%" style="stop-color:#FF6B9D"/>
    </linearGradient>
    <linearGradient id="gv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF88"/>
      <stop offset="50%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#7B61FF"/>
    </linearGradient>
    <linearGradient id="gg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF88"/>
      <stop offset="100%" style="stop-color:#00CC6A"/>
    </linearGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gl2">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="12" fill="#0D1117"/>

  <!-- Subtle grid background -->
  <g opacity="0.04">
    <line x1="0" y1="68" x2="1200" y2="68" stroke="#fff" stroke-width="0.8"/>
    <line x1="0" y1="136" x2="1200" y2="136" stroke="#fff" stroke-width="0.8"/>
    <line x1="0" y1="204" x2="1200" y2="204" stroke="#fff" stroke-width="0.8"/>
    <line x1="0" y1="272" x2="1200" y2="272" stroke="#fff" stroke-width="0.8"/>
    <line x1="200" y1="0" x2="200" y2="340" stroke="#fff" stroke-width="0.8"/>
    <line x1="400" y1="0" x2="400" y2="340" stroke="#fff" stroke-width="0.8"/>
    <line x1="600" y1="0" x2="600" y2="340" stroke="#fff" stroke-width="0.8"/>
    <line x1="800" y1="0" x2="800" y2="340" stroke="#fff" stroke-width="0.8"/>
    <line x1="1000" y1="0" x2="1000" y2="340" stroke="#fff" stroke-width="0.8"/>
  </g>

  <!-- Outer glow -->
  <circle cx="160" cy="150" r="140" fill="url(#gv)" opacity="0.06" filter="url(#gl)"/>

  <!-- ─── Left: Logo symbol + branding ─── -->
  <g transform="translate(145, 130)" filter="url(#gl)">
    <!-- ">" cursor -->
    <path d="M-48,-52 L28,0 L-48,52 Z" fill="url(#gv)" opacity="0.85"/>
    <!-- "S" curve -->
    <path d="M-12,-58 C28,-58 45,-38 45,-24 C45,-8 28,2 -5,10 C-28,18 -45,30 -45,46 C-45,58 -28,68 5,68 C42,68 58,52 58,38"
          fill="none" stroke="url(#gv)" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
    <!-- Cursor blink -->
    <rect x="52" y="-62" width="3.5" height="38" rx="1.75" fill="url(#gg)" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.15;0.85" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Title + tagline -->
  <text x="325" y="140"
        font-family="'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif"
        font-size="68" font-weight="700" letter-spacing="6" fill="white">
    SYNERIX
  </text>
  <text x="329" y="185"
        font-family="'JetBrains Mono','Fira Code','SF Mono',monospace"
        font-size="18" letter-spacing="5" fill="#8B949E">
    AI-NATIVE CODING TERMINAL
  </text>

  <!-- Badges row -->
  <g transform="translate(325, 210)">
    <rect x="0" y="0" width="80" height="26" rx="13" fill="#21262D"/>
    <text x="40" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#FF6B9D">Rust 1.75+</text>
    <rect x="90" y="0" width="95" height="26" rx="13" fill="#21262D"/>
    <text x="137" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#00FF88">1342 tests</text>
    <rect x="195" y="0" width="85" height="26" rx="13" fill="#21262D"/>
    <text x="237" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#00D4FF">3.8 MB</text>
    <rect x="290" y="0" width="105" height="26" rx="13" fill="#21262D"/>
    <text x="342" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#7B61FF">Vibe mode ✦</text>
  </g>

  <!-- ─── Right: TUI Screenshot Mockup ─── -->
  <g transform="translate(670, 28)">
    <!-- Terminal window background -->
    <rect width="500" height="284" rx="12" fill="#1A1B26" stroke="#3B3E54" stroke-width="1.5"/>

    <!-- Title bar -->
    <rect width="500" height="32" rx="12" fill="#21262D"/>
    <rect y="20" width="500" height="12" fill="#21262D"/>
    <circle cx="16" cy="16" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="16" r="5" fill="#FFBD2E"/>
    <circle cx="56" cy="16" r="5" fill="#27C93F"/>
    <text x="250" y="21" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8B949E">synerix — AI-Native Coding Terminal</text>

    <!-- ═══ TUI Layout (within terminal) ═══ -->
    <g transform="translate(8, 38)">

      <!-- ── Sidebar ── -->
      <g transform="translate(0, 0)">
        <rect width="116" height="224" rx="8" fill="none" stroke="#3B3E54" stroke-width="1"/>
        <!-- Tab bar -->
        <rect x="0" y="0" width="116" height="12" rx="8" fill="#3B3E54" opacity="0.3"/>
        <!-- Tab text -->
        <text x="8" y="9" font-family="'JetBrains Mono',monospace" font-size="7" fill="#7DCFFF" font-weight="bold">📁 Files</text>
        <text x="40" y="9" font-family="'JetBrains Mono',monospace" font-size="7" fill="#69708C">📋 Sessions</text>
        <!-- File tree -->
        <text x="10" y="28" font-family="'JetBrains Mono',monospace" font-size="7" fill="#A0AAD2">📁 src</text>
        <text x="20" y="42" font-family="'JetBrains Mono',monospace" font-size="7" fill="#C0CAF5"> 📄 main.rs</text>
        <text x="20" y="54" font-family="'JetBrains Mono',monospace" font-size="7" fill="#C0CAF5"> 📄 lib.rs</text>
        <text x="10" y="68" font-family="'JetBrains Mono',monospace" font-size="7" fill="#A0AAD2">📁 crates</text>
        <text x="20" y="80" font-family="'JetBrains Mono',monospace" font-size="7" fill="#7DCFFF">  📄 synerix</text>
        <text x="10" y="94" font-family="'JetBrains Mono',monospace" font-size="7" fill="#A0AAD2">📁 .synerix</text>
        <text x="20" y="106" font-family="'JetBrains Mono',monospace" font-size="7" fill="#C0CAF5"> 📄 config.toml</text>
      </g>

      <!-- ── Main content area ── -->
      <g transform="translate(124, 0)">

        <!-- Chat panel -->
        <rect width="355" height="130" rx="8" fill="none" stroke="#3B3E54" stroke-width="1"/>
        <text x="10" y="12" font-family="'JetBrains Mono',monospace" font-size="8" fill="#7DCFFF" font-weight="bold">💬 Chat</text>

        <!-- Chat messages -->
        <!-- User message -->
        <text x="10" y="30" font-family="'JetBrains Mono',monospace" font-size="8" fill="#7DCFFF" font-weight="bold">▸ You:</text>
        <text x="64" y="30" font-family="'JetBrains Mono',monospace" font-size="8" fill="#C0CAF5">Add Vibe mode to Synerix</text>

        <!-- AI reply -->
        <text x="10" y="46" font-family="'JetBrains Mono',monospace" font-size="8" fill="#9ECE6A" font-weight="bold">◆ AI:</text>
        <text x="56" y="46" font-family="'JetBrains Mono',monospace" font-size="8" fill="#C0CAF5">Let me design the Vibe mode.</text>

        <!-- Tool call -->
        <text x="10" y="60" font-family="'JetBrains Mono',monospace" font-size="7" fill="#69708C">└─</text>
        <text x="22" y="60" font-family="'JetBrains Mono',monospace" font-size="7" fill="#7DCFFF" font-weight="bold">read_file</text>
        <text x="66" y="60" font-family="'JetBrains Mono',monospace" font-size="7" fill="#69708C">(coding_modes.rs:1-233)</text>
        <text x="10" y="72" font-family="'JetBrains Mono',monospace" font-size="7" fill="#9ECE6A">     ✓ 233 lines read</text>

        <!-- AI streaming -->
        <text x="10" y="90" font-family="'JetBrains Mono',monospace" font-size="8" fill="#9ECE6A" font-weight="bold">◆ AI:</text>
        <text x="56" y="90" font-family="'JetBrains Mono',monospace" font-size="8" fill="#C0CAF5">I've added `CodingMode::Vibe` with</text>
        <text x="56" y="104" font-family="'JetBrains Mono',monospace" font-size="8" fill="#C0CAF5">teal status bar and auto-iterate</text>
        <text x="56" y="118" font-family="'JetBrains Mono',monospace" font-size="8" fill="#9ECE6A">▌</text>

        <!-- Diff panel -->
        <g transform="translate(0, 138)">
          <rect width="355" height="48" rx="8" fill="none" stroke="#3B3E54" stroke-width="1"/>
          <text x="10" y="12" font-family="'JetBrains Mono',monospace" font-size="8" fill="#7DCFFF" font-weight="bold">📝 Diff Preview</text>
          <text x="10" y="30" font-family="'JetBrains Mono',monospace" font-size="8" fill="#9ECE6A">+  use crate::coding_modes::CodingMode;</text>
          <text x="10" y="42" font-family="'JetBrains Mono',monospace" font-size="8" fill="#F7768E">-  CodingMode::Vibe => todo!(),</text>
        </g>

        <!-- Input bar -->
        <g transform="translate(0, 189)">
          <rect width="355" height="26" rx="8" fill="none" stroke="#9ECE6A" stroke-width="1"/>
          <text x="10" y="16" font-family="'JetBrains Mono',monospace" font-size="8" fill="#9ECE6A" font-weight="bold">⌨ Input</text>
          <text x="10" y="16" font-family="'JetBrains Mono',monospace" font-size="8" fill="#C0CAF5">     /mode vibe — immerse in flow state</text>
          <rect x="233" y="8" width="5" height="10" rx="1" fill="#7DCFFF" opacity="0.9"/>
        </g>
      </g>

    </g>

    <!-- ── Status bar ── -->
    <g transform="translate(8, 265)">
      <rect width="484" height="14" rx="4" fill="#282A3A"/>
      <!-- Coding mode badge -->
      <rect x="2" y="1" width="40" height="12" rx="6" fill="#507882"/>
      <text x="22" y="10" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#DCEEFF" font-weight="bold"> 🎵 Vibe</text>
      <!-- Normal mode -->
      <rect x="46" y="1" width="50" height="12" rx="6" fill="#1E6432"/>
      <text x="71" y="10" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7" fill="#9ECE6A" font-weight="bold"> INSERT</text>
      <!-- Separator -->
      <text x="100" y="10" font-family="sans-serif" font-size="7" fill="#565C74">│</text>
      <!-- Agent state -->
      <text x="108" y="10" font-family="'JetBrains Mono',monospace" font-size="7" fill="#9ECE6A">● Idle</text>
      <text x="140" y="10" font-family="sans-serif" font-size="7" fill="#565C74">│</text>
      <!-- Tokens -->
      <text x="148" y="10" font-family="'JetBrains Mono',monospace" font-size="7" fill="#A0AAD2">4.2k / 128k tokens</text>
      <text x="240" y="10" font-family="sans-serif" font-size="7" fill="#565C74">│</text>
      <!-- Model -->
      <text x="248" y="10" font-family="'JetBrains Mono',monospace" font-size="7" fill="#A0AAD2">deepseek-v4</text>
      <text x="298" y="10" font-family="sans-serif" font-size="7" fill="#565C74">│</text>
      <!-- Sandbox -->
      <text x="306" y="10" font-family="'JetBrains Mono',monospace" font-size="7" fill="#8B949E">⚡ auto</text>
      <!-- Right-aligned: Vibe coding tag -->
      <text x="390" y="10" font-family="'JetBrains Mono',monospace" font-size="7" fill="#507882">[VIBE CODING]</text>
    </g>
  </g>
</svg>
