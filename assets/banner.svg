<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="gm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7DCFFF"/>
      <stop offset="50%" style="stop-color:#7B61FF"/>
      <stop offset="100%" style="stop-color:#FF6B9D"/>
    </linearGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="12" fill="#0D1117"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="68" x2="1200" y2="68" stroke="#fff" stroke-width="0.8"/>
    <line x1="0" y1="136" x2="1200" y2="136" stroke="#fff" stroke-width="0.8"/>
    <line x1="0" y1="204" x2="1200" y2="204" stroke="#fff" stroke-width="0.8"/>
    <line x1="0" y1="272" x2="1200" y2="272" stroke="#fff" stroke-width="0.8"/>
    <line x1="200" y1="0" x2="200" y2="340" stroke="#fff" stroke-width="0.8"/>
    <line x1="400" y1="0" x2="400" y2="340" stroke="#fff" stroke-width="0.8"/>
    <line x1="600" y1="0" x2="600" y2="340" stroke="#fff" stroke-width="0.8"/>
    <line x1="800" y1="0" x2="800" y2="340" stroke="#fff" stroke-width="0.8"/>
    <line x1="1000" y1="0" x2="1000" y2="340" stroke="#fff" stroke-width="0.8"/>
  </g>

  <!-- Outer glow -->
  <circle cx="160" cy="150" r="140" fill="#7DCFFF" opacity="0.05" filter="url(#gl)"/>

  <!-- ─── Left: Logo mark + branding ─── -->
  <g transform="translate(145, 130)" filter="url(#gl)">
    <!-- Diamond logo -->
    <path d="M0,-50 L32,0 L0,50 L-32,0 Z" fill="none" stroke="url(#gm)" stroke-width="3" opacity="0.9"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="4" fill="#7DCFFF" opacity="0.8"/>
    <!-- SYNERIX wordmark -->
    <text x="-90" y="80"
          font-family="'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif"
          font-size="32" font-weight="700" letter-spacing="8" fill="white">
      SYNERIX
    </text>
    <text x="-88" y="105"
          font-family="'JetBrains Mono','Fira Code','SF Mono',monospace"
          font-size="11" letter-spacing="4" fill="#8B949E">
      AI-NATIVE CODING TERMINAL
    </text>
  </g>

  <!-- Badges -->
  <g transform="translate(145, 260)">
    <rect x="0" y="0" width="86" height="24" rx="12" fill="#21262D"/>
    <text x="43" y="15" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#FF6B9D">Rust 1.75+</text>
    <rect x="94" y="0" width="72" height="24" rx="12" fill="#21262D"/>
    <text x="130" y="15" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#00FF88">1342 tests</text>
    <rect x="174" y="0" width="72" height="24" rx="12" fill="#21262D"/>
    <text x="210" y="15" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#7DCFFF">Vibe mode</text>
  </g>

  <!-- ─── Right: TUI Screenshot Mockup ─── -->
  <g transform="translate(620, 24)">
    <rect width="560" height="292" rx="12" fill="#1A1B26" stroke="#3B3E54" stroke-width="1.5"/>

    <!-- Title bar -->
    <rect width="560" height="34" rx="12" fill="#21262D"/>
    <rect y="22" width="560" height="12" fill="#21262D"/>
    <circle cx="16" cy="17" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="17" r="5" fill="#FFBD2E"/>
    <circle cx="56" cy="17" r="5" fill="#27C93F"/>
    <text x="280" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8B949E">◆ Synerix — AI-Native Coding Terminal</text>

    <!-- ── Sidebar ── -->
    <g transform="translate(8, 40)">
      <rect width="120" height="232" rx="8" fill="none" stroke="#3B3E54" stroke-width="1"/>
      <rect x="0" y="0" width="120" height="14" rx="8" fill="#3B3E54" opacity="0.4"/>
      <text x="8" y="11" font-family="'JetBrains Mono',monospace" font-size="8" fill="#7DCFFF" font-weight="bold">📁 Files</text>
      <text x="44" y="11" font-family="'JetBrains Mono',monospace" font-size="8" fill="#69708C">📋 Sessions</text>
      <text x="12" y="32" font-family="'JetBrains Mono',monospace" font-size="8" fill="#A0AAD2">📁 src</text>
      <text x="22" y="46" font-family="'JetBrains Mono',monospace" font-size="8" fill="#C0CAF5"> main.rs</text>
      <text x="12" y="60" font-family="'JetBrains Mono',monospace" font-size="8" fill="#A0AAD2">📁 crates</text>
      <text x="22" y="74" font-family="'JetBrains Mono',monospace" font-size="8" fill="#7DCFFF"> synerix</text>
      <text x="22" y="88" font-family="'JetBrains Mono',monospace" font-size="8" fill="#69708C"> config.toml</text>
    </g>

    <!-- ── Main content ── -->
    <g transform="translate(136, 40)">
      <!-- Chat panel -->
      <rect width="416" height="140" rx="8" fill="none" stroke="#3B3E54" stroke-width="1"/>
      <text x="8" y="14" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF" font-weight="bold">💬 Chat</text>

      <!-- Welcome logo -->
      <text x="8" y="34" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF" font-weight="bold">  ___   _   _   ___ </text>
      <text x="8" y="46" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF" font-weight="bold"> / _ \\ | | | | / _ \\</text>
      <text x="8" y="58" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF" font-weight="bold">| | | || | | || | | |</text>
      <text x="8" y="70" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF" font-weight="bold">| | | || | | || | | |</text>
      <text x="8" y="82" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF" font-weight="bold">| |_| || |_| || |_| |</text>
      <text x="8" y="94" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF" font-weight="bold"> \\___/  \\___/  \\___/</text>

      <!-- Diff preview -->
      <g transform="translate(0, 108)">
        <rect width="416" height="28" rx="8" fill="none" stroke="#3B3E54" stroke-width="1"/>
        <text x="8" y="14" font-family="'JetBrains Mono',monospace" font-size="8" fill="#7DCFFF" font-weight="bold">📝 Diff Preview</text>
        <text x="8" y="26" font-family="'JetBrains Mono',monospace" font-size="8" fill="#9ECE6A">+  use crate::coding_modes::CodingMode;</text>
      </g>
    </g>

    <!-- ── Input bar ── -->
    <g transform="translate(136, 188)">
      <rect width="416" height="28" rx="8" fill="none" stroke="#9ECE6A" stroke-width="1"/>
      <text x="8" y="17" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9ECE6A" font-weight="bold">⌨ Input</text>
      <text x="60" y="17" font-family="'JetBrains Mono',monospace" font-size="9" fill="#C0CAF5">欢迎使用 Synerix！</text>
      <rect x="180" y="8" width="5" height="11" rx="1" fill="#7DCFFF" opacity="0.9"/>
    </g>

    <!-- ── Status bar ── -->
    <g transform="translate(8, 280)">
      <rect width="544" height="16" rx="4" fill="#282A3A"/>
      <!-- Mode badge -->
      <rect x="2" y="1" width="48" height="14" rx="7" fill="#507882"/>
      <text x="26" y="12" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#DCEEFF" font-weight="bold">🎵 Vibe</text>
      <text x="54" y="12" font-family="sans-serif" font-size="8" fill="#565C74">│</text>
      <!-- Agent state -->
      <text x="62" y="12" font-family="'JetBrains Mono',monospace" font-size="8" fill="#9ECE6A">● Idle</text>
      <text x="100" y="12" font-family="sans-serif" font-size="8" fill="#565C74">│</text>
      <!-- Model -->
      <text x="108" y="12" font-family="'JetBrains Mono',monospace" font-size="8" fill="#A0AAD2">deepseek-v4</text>
      <text x="168" y="12" font-family="sans-serif" font-size="8" fill="#565C74">│</text>
      <!-- Sandbox -->
      <text x="176" y="12" font-family="'JetBrains Mono',monospace" font-size="8" fill="#8B949E">⚡ auto</text>
      <text x="210" y="12" font-family="sans-serif" font-size="8" fill="#565C74">│</text>
      <!-- Right-aligned label -->
      <text x="410" y="12" font-family="'JetBrains Mono',monospace" font-size="8" fill="#7DCFFF">◆ Synerix</text>
    </g>
  </g>
</svg>
