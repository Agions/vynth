<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="mg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DCFFF"/>
      <stop offset="45%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>
    <radialGradient id="ambient" cx="14%" cy="44%" r="40%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="termTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262D"/>
      <stop offset="100%" stop-color="#1C2128"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="#0D1117"/>
  <rect width="1200" height="340" rx="16" fill="url(#ambient)"/>
  <!-- hairline border -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#1C2230" stroke-width="1.5"/>

  <!-- Subtle dot grid -->
  <g fill="#FFFFFF" opacity="0.035">
    <circle cx="60" cy="60" r="1"/><circle cx="120" cy="60" r="1"/><circle cx="60" cy="120" r="1"/>
    <circle cx="1140" cy="60" r="1"/><circle cx="1080" cy="60" r="1"/><circle cx="1140" cy="280" r="1"/>
  </g>

  <!-- ─── Left: monogram + wordmark ─── -->
  <g transform="translate(150, 120)" filter="url(#soft)">
    <!-- prompt chevron > -->
    <path d="M-46,-44 L-14,0 L-46,44"
          fill="none" stroke="url(#mg)" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- S sweep -->
    <path d="M2,-48 C46,-48 62,-16 32,0 C4,14 -12,12 -10,28 C-8,44 26,50 58,34"
          fill="none" stroke="url(#mg)" stroke-width="11"
          stroke-linecap="round"/>
    <!-- underscore _ -->
    <path d="M-46,70 L46,70"
          fill="none" stroke="url(#sg)" stroke-width="9"
          stroke-linecap="round" opacity="0.95"/>
  </g>
  <circle cx="150" cy="120" r="3" fill="#00FF88" opacity="0.9" filter="url(#glow)"/>

  <!-- Wordmark -->
  <text x="150" y="218" text-anchor="middle"
        font-family="'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif"
        font-size="38" font-weight="800" letter-spacing="9" fill="#F0F6FC">
    SYNERIX
  </text>
  <text x="150" y="242" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',monospace"
        font-size="10.5" letter-spacing="4" fill="#8B949E">
    AI-NATIVE CODING TERMINAL
  </text>

  <!-- Badges -->
  <g transform="translate(150, 268)" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10.5" font-weight="700">
    <g transform="translate(-96, 0)">
      <rect width="62" height="22" rx="11" fill="#161B22" stroke="#30363D"/>
      <text x="31" y="15" text-anchor="middle" fill="#FF7B72">Rust</text>
    </g>
    <g transform="translate(-28, 0)">
      <rect width="86" height="22" rx="11" fill="#161B22" stroke="#30363D"/>
      <text x="43" y="15" text-anchor="middle" fill="#7EE787">1342 tests</text>
    </g>
    <g transform="translate(66, 0)">
      <rect width="84" height="22" rx="11" fill="#161B22" stroke="#30363D"/>
      <text x="42" y="15" text-anchor="middle" fill="#7DCFFF">Vibe mode</text>
    </g>
  </g>

  <!-- ─── Right: TUI window mockup ─── -->
  <g transform="translate(560, 28)">
    <rect width="600" height="284" rx="14" fill="#1A1B26" stroke="#2A2E45" stroke-width="1.5"/>
    <!-- drop shadow under window -->
    <rect x="0" y="0" width="600" height="284" rx="14" fill="url(#termTop)" opacity="0.0"/>

    <!-- Title bar -->
    <path d="M0,14 a14,14 0 0 1 14,-14 h572 a14,14 0 0 1 14,14 v20 h-600 z" fill="#21262D"/>
    <circle cx="18" cy="17" r="5" fill="#FF5F56"/>
    <circle cx="38" cy="17" r="5" fill="#FFBD2E"/>
    <circle cx="58" cy="17" r="5" fill="#27C93F"/>
    <text x="300" y="21" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8B949E">◆ Synerix — AI-Native Coding Terminal</text>

    <!-- Sidebar -->
    <g transform="translate(10, 46)">
      <rect width="124" height="222" rx="8" fill="none" stroke="#2A2E45" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF" font-weight="700">📁 Files</text>
      <text x="52" y="18" font-family="'JetBrains Mono',monospace" font-size="9" fill="#69708C">Sessions</text>
      <line x1="10" y1="26" x2="114" y2="26" stroke="#2A2E45"/>
      <text x="12" y="42" font-family="'JetBrains Mono',monospace" font-size="9" fill="#A0AAD2">📁 src</text>
      <text x="22" y="56" font-family="'JetBrains Mono',monospace" font-size="9" fill="#C0CAF5">main.rs</text>
      <text x="12" y="70" font-family="'JetBrains Mono',monospace" font-size="9" fill="#A0AAD2">📁 crates</text>
      <text x="22" y="84" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF">synerix</text>
      <text x="22" y="98" font-family="'JetBrains Mono',monospace" font-size="9" fill="#69708C">config.toml</text>
      <!-- active highlight -->
      <rect x="8" y="48" width="108" height="13" rx="3" fill="#7DCFFF" opacity="0.08"/>
    </g>

    <!-- Main panel: chat -->
    <g transform="translate(142, 46)">
      <rect width="448" height="156" rx="8" fill="none" stroke="#2A2E45" stroke-width="1"/>
      <text x="10" y="18" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF" font-weight="700">💬 Chat</text>
      <line x1="10" y1="26" x2="438" y2="26" stroke="#2A2E45"/>

      <!-- AI line -->
      <text x="12" y="44" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9ECE6A" font-weight="700">◆ AI</text>
      <text x="34" y="44" font-family="'JetBrains Mono',monospace" font-size="9" fill="#C0CAF5">Refactoring handler_common_key…</text>

      <!-- code diff block -->
      <g transform="translate(12, 52)">
        <rect width="424" height="44" rx="6" fill="#0F1117"/>
        <text x="8" y="16" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9ECE6A">+ pub fn handle_common_key(k: KeyEvent) {</text>
        <text x="8" y="30" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9ECE6A">+     match k.code { Enter => submit, _ => {} }</text>
        <text x="8" y="44" font-family="'JetBrains Mono',monospace" font-size="9" fill="#F7768E">- fn handle_search_key(...) { ... }</text>
      </g>

      <text x="12" y="116" font-family="'JetBrains Mono',monospace" font-size="9" fill="#7DCFFF" font-weight="700">▸ user</text>
      <text x="42" y="116" font-family="'JetBrains Mono',monospace" font-size="9" fill="#C0CAF5">合并那两处重复吧</text>

      <!-- input bar -->
      <g transform="translate(0, 128)">
        <rect width="448" height="24" rx="6" fill="none" stroke="#9ECE6A" stroke-width="1"/>
        <text x="10" y="16" font-family="'JetBrains Mono',monospace" font-size="9" fill="#9ECE6A" font-weight="700">⌨</text>
        <text x="24" y="16" font-family="'JetBrains Mono',monospace" font-size="9" fill="#69708C">describe → generate → test → fix</text>
        <rect x="322" y="7" width="5" height="11" rx="1.5" fill="#7DCFFF" opacity="0.95"/>
      </g>
    </g>

    <!-- Status bar -->
    <g transform="translate(10, 244)">
      <rect width="580" height="16" rx="4" fill="#282A3A"/>
      <rect x="3" y="2" width="52" height="12" rx="6" fill="#507882"/>
      <text x="29" y="11" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8" fill="#DCEEFF" font-weight="700">🎵 Vibe</text>
      <text x="60" y="11" font-family="sans-serif" font-size="8" fill="#565C74">│</text>
      <text x="68" y="11" font-family="'JetBrains Mono',monospace" font-size="8" fill="#9ECE6A">● Idle</text>
      <text x="104" y="11" font-family="sans-serif" font-size="8" fill="#565C74">│</text>
      <text x="112" y="11" font-family="'JetBrains Mono',monospace" font-size="8" fill="#A0AAD2">deepseek-v4</text>
      <text x="178" y="11" font-family="sans-serif" font-size="8" fill="#565C74">│</text>
      <text x="186" y="11" font-family="'JetBrains Mono',monospace" font-size="8" fill="#8B949E">⚡ sandbox auto</text>
      <text x="568" y="11" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="8" fill="#7DCFFF">◆ Synerix</text>
    </g>
  </g>
</svg>
