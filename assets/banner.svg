<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="gm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="50%" style="stop-color:#7B61FF"/>
      <stop offset="100%" style="stop-color:#FF6B9D"/>
    </linearGradient>
    <linearGradient id="gg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF88"/>
      <stop offset="100%" style="stop-color:#00CC6A"/>
    </linearGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="12" fill="#0D1117"/>

  <!-- Grid -->
  <g opacity="0.04">
    <line x1="0" y1="64" x2="1200" y2="64" stroke="#fff" stroke-width="0.8"/>
    <line x1="0" y1="128" x2="1200" y2="128" stroke="#fff" stroke-width="0.8"/>
    <line x1="0" y1="192" x2="1200" y2="192" stroke="#fff" stroke-width="0.8"/>
    <line x1="0" y1="256" x2="1200" y2="256" stroke="#fff" stroke-width="0.8"/>
    <line x1="200" y1="0" x2="200" y2="320" stroke="#fff" stroke-width="0.8"/>
    <line x1="400" y1="0" x2="400" y2="320" stroke="#fff" stroke-width="0.8"/>
    <line x1="600" y1="0" x2="600" y2="320" stroke="#fff" stroke-width="0.8"/>
    <line x1="800" y1="0" x2="800" y2="320" stroke="#fff" stroke-width="0.8"/>
    <line x1="1000" y1="0" x2="1000" y2="320" stroke="#fff" stroke-width="0.8"/>
  </g>

  <!-- Left: Logo symbol -->
  <g transform="translate(140, 130)" filter="url(#gl)">
    <path d="M-50,-55 L30,0 L-50,55 Z" fill="url(#gm)" opacity="0.85"/>
    <path d="M-15,-60 C30,-60 48,-40 48,-25 C48,-10 30,0 -8,10 C-30,18 -48,30 -48,45 C48,60 30,68 8,68 C-25,68 -42,55 -42,40"
          fill="none" stroke="url(#gm)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <rect x="55" y="-65" width="4" height="40" rx="2" fill="url(#gg)" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.2;0.85" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Center: Title + tagline -->
  <text x="320" y="140"
        font-family="'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif"
        font-size="68" font-weight="700" letter-spacing="6" fill="white">
    SYNERIX
  </text>
  <text x="324" y="185"
        font-family="'JetBrains Mono','Fira Code','SF Mono',monospace"
        font-size="18" letter-spacing="5" fill="#8B949E">
    AI-NATIVE CODING TERMINAL
  </text>

  <!-- Stats badges -->
  <g transform="translate(320, 210)">
    <!-- Rust badge -->
    <rect x="0" y="0" width="80" height="26" rx="13" fill="#21262D"/>
    <text x="40" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#FF6B9D">Rust 1.75+</text>
    <!-- Tests badge -->
    <rect x="90" y="0" width="95" height="26" rx="13" fill="#21262D"/>
    <text x="137" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#00FF88">1149 tests</text>
    <!-- Size badge -->
    <rect x="195" y="0" width="80" height="26" rx="13" fill="#21262D"/>
    <text x="235" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#00D4FF">3.8 MB</text>
    <!-- Startup badge -->
    <rect x="285" y="0" width="90" height="26" rx="13" fill="#21262D"/>
    <text x="330" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#7B61FF">2ms boot</text>
  </g>

  <!-- Right: Terminal mockup -->
  <g transform="translate(780, 40)">
    <rect width="360" height="240" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <!-- Title bar -->
    <rect width="360" height="34" rx="10" fill="#21262D"/>
    <rect y="24" width="360" height="10" fill="#21262D"/>
    <circle cx="18" cy="17" r="6" fill="#FF5F56"/>
    <circle cx="40" cy="17" r="6" fill="#FFBD2E"/>
    <circle cx="62" cy="17" r="6" fill="#27C93F"/>
    <text x="180" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8B949E">synerix — main.rs</text>
    <!-- Code lines -->
    <text x="16" y="60" font-family="'JetBrains Mono',monospace" font-size="12" fill="#00D4FF">fn</text>
    <text x="34" y="60" font-family="'JetBrains Mono',monospace" font-size="12" fill="#D2A8FF"> main</text>
    <text x="72" y="60" font-family="'JetBrains Mono',monospace" font-size="12" fill="#E6EDF3">() {</text>
    <text x="28" y="82" font-family="'JetBrains Mono',monospace" font-size="12" fill="#00D4FF">    let</text>
    <text x="60" y="82" font-family="'JetBrains Mono',monospace" font-size="12" fill="#E6EDF3"> app = </text>
    <text x="110" y="82" font-family="'JetBrains Mono',monospace" font-size="12" fill="#D2A8FF">Synerix</text>
    <text x="165" y="82" font-family="'JetBrains Mono',monospace" font-size="12" fill="#E6EDF3">::</text>
    <text x="181" y="82" font-family="'JetBrains Mono',monospace" font-size="12" fill="#D2A8FF">new</text>
    <text x="208" y="82" font-family="'JetBrains Mono',monospace" font-size="12" fill="#E6EDF3">();</text>
    <text x="28" y="104" font-family="'JetBrains Mono',monospace" font-size="12" fill="#00D4FF">    app</text>
    <text x="58" y="104" font-family="'JetBrains Mono',monospace" font-size="12" fill="#E6EDF3">.</text>
    <text x="64" y="104" font-family="'JetBrains Mono',monospace" font-size="12" fill="#D2A8FF">run</text>
    <text x="88" y="104" font-family="'JetBrains Mono',monospace" font-size="12" fill="#E6EDF3">().</text>
    <text x="110" y="104" font-family="'JetBrains Mono',monospace" font-size="12" fill="#D2A8FF">await</text>
    <text x="148" y="104" font-family="'JetBrains Mono',monospace" font-size="12" fill="#E6EDF3">;</text>
    <text x="16" y="126" font-family="'JetBrains Mono',monospace" font-size="12" fill="#E6EDF3">}</text>
    <!-- Terminal prompt below -->
    <text x="16" y="160" font-family="'JetBrains Mono',monospace" font-size="13" fill="#00FF88">$</text>
    <text x="30" y="160" font-family="'JetBrains Mono',monospace" font-size="13" fill="#E6EDF3"> synerix</text>
    <text x="16" y="182" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8B949E">Synerix v0.0.1 starting up</text>
    <text x="16" y="200" font-family="'JetBrains Mono',monospace" font-size="11" fill="#27C93F">✓ Config loaded (0ms)</text>
    <text x="16" y="218" font-family="'JetBrains Mono',monospace" font-size="11" fill="#27C93F">✓ TUI initialized (2ms)</text>
  </g>
</svg>