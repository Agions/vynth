<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Primary gradient: cyan -> violet -> pink -->
    <linearGradient id="mg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7DCFFF"/>
      <stop offset="45%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#FF6B9D"/>
    </linearGradient>
    <!-- Secondary gradient for accent stroke -->
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#7DCFFF"/>
    </linearGradient>
    <!-- Soft ambient glow -->
    <radialGradient id="ambient" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#7B61FF" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#7B61FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7B61FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App-tile background with inner highlight -->
  <rect width="512" height="512" rx="116" ry="116" fill="#0D1117"/>
  <rect x="1" y="1" width="510" height="510" rx="115" ry="115" fill="none" stroke="#1C2230" stroke-width="1.5"/>
  <!-- Ambient color wash -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#ambient)"/>

  <!-- Faint concentric rings -->
  <g fill="none" stroke="#7B61FF" stroke-width="1" opacity="0.10">
    <circle cx="256" cy="210" r="178"/>
    <circle cx="256" cy="210" r="138" opacity="0.6"/>
  </g>

  <!-- ─── Monogram: ">_" terminal glyph fused with "S" ─── -->
  <g transform="translate(256, 200)" filter="url(#soft)">
    <!-- Prompt chevron ">" -->
    <path d="M-66,-58 L-22,0 L-66,58"
          fill="none" stroke="url(#mg)" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- "S" sweep curve -->
    <path d="M2,-62 C58,-62 78,-20 40,2 C4,22 -18,18 -14,40 C-10,60 30,66 70,44"
          fill="none" stroke="url(#mg)" stroke-width="14"
          stroke-linecap="round"/>
    <!-- Underscore "_"  -->
    <path d="M-66,92 L66,92"
          fill="none" stroke="url(#sg)" stroke-width="12"
          stroke-linecap="round" opacity="0.95"/>
  </g>

  <!-- Center accent dot -->
  <circle cx="256" cy="200" r="3.5" fill="#00FF88" opacity="0.9" filter="url(#glow)"/>

  <!-- ─── Wordmark ─── -->
  <text x="256" y="330" text-anchor="middle"
        font-family="'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif"
        font-size="58" font-weight="800" letter-spacing="12" fill="#F0F6FC">
    SYNERIX
  </text>
  <!-- Tagline -->
  <text x="256" y="362" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',monospace"
        font-size="13" letter-spacing="6" fill="#8B949E">
    AI-NATIVE CODING TERMINAL
  </text>

  <!-- Bottom mode chips -->
  <g transform="translate(256, 412)" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" font-weight="700">
    <g transform="translate(-126, 0)">
      <rect x="0" y="0" width="74" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="37" y="17" text-anchor="middle" fill="#7DCFFF">⚡ Act</text>
    </g>
    <g transform="translate(-38, 0)">
      <rect x="0" y="0" width="76" height="26" rx="13" fill="#161B22" stroke="#507882" stroke-width="1"/>
      <text x="38" y="17" text-anchor="middle" fill="#507882">🎵 Vibe</text>
    </g>
    <g transform="translate(52, 0)">
      <rect x="0" y="0" width="74" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="37" y="17" text-anchor="middle" fill="#9ECE6A">🗣 Chat</text>
    </g>
  </g>
</svg>
