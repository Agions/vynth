<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Primary gradient: cyan → violet -->
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7DCFFF"/>
      <stop offset="50%" style="stop-color:#BB9AF7"/>
      <stop offset="100%" style="stop-color:#F7768E"/>
    </linearGradient>
    <!-- Accent gradient for highlights -->
    <linearGradient id="grad-accent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF88"/>
      <stop offset="100%" style="stop-color:#7DCFFF"/>
    </linearGradient>
    <!-- Ambient glow -->
    <radialGradient id="ambient" cx="50%" cy="45%" r="55%">
      <stop offset="0%" style="stop-color:#7B61FF;stop-opacity:0.25"/>
      <stop offset="50%" style="stop-color:#7B61FF;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#7B61FF;stop-opacity:0"/>
    </radialGradient>
    <!-- Soft blur for glow effects -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip path for rounded corners -->
    <clipPath id="tile">
      <rect width="512" height="512" rx="100" ry="100"/>
    </clipPath>
  </defs>

  <!-- Background with subtle gradient -->
  <rect width="512" height="512" rx="100" ry="100" fill="#0D1117"/>
  
  <!-- Subtle dot grid pattern -->
  <g clip-path="url(#tile)" opacity="0.06">
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#7DCFFF"/>
    </pattern>
    <rect width="512" height="512" fill="url(#dots)"/>
  </g>

  <!-- Ambient color wash -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#ambient)"/>

  <!-- Central logo mark -->
  <g transform="translate(256, 200)" filter="url(#soft)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#grad-primary)" stroke-width="1.5" opacity="0.25"/>
    
    <!-- Terminal bracket symbol ">_" -->
    <g filter="url(#glow)">
      <!-- Chevron ">" -->
      <path d="M-50,-55 L-15,0 L-50,55 Z" fill="url(#grad-primary)" opacity="0.85"/>
      <!-- Underscore "_" -->
      <rect x="-58" y="75" width="110" height="8" rx="4" fill="url(#grad-accent)" opacity="0.9"/>
    </g>
    
    <!-- Center "S" monogram -->
    <path d="M-5,-70 C45,-70 65,-45 65,-25 C65,-5 45,5 -5,15 C-35,23 -55,40 -55,60 C-55,80 -35,95 5,95 C40,95 60,75 60,55"
          fill="none" stroke="url(#grad-primary)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- "SYNERIX" wordmark -->
  <text x="256" y="335" text-anchor="middle"
        font-family="'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif"
        font-size="52" font-weight="800" letter-spacing="8" fill="#F0F6FC">
    SYNERIX
  </text>

  <!-- Tagline -->
  <text x="256" y="370" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','SF Mono',monospace"
        font-size="12" letter-spacing="4" fill="#8B949E">
    AI-NATIVE CODING TERMINAL
  </text>

  <!-- Mode indicator chips -->
  <g transform="translate(256, 415)" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="600">
    <g transform="translate(-50, 0)">
      <rect x="0" y="0" width="72" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="36" y="15" text-anchor="middle" fill="#BB9AF7">📋 Plan</text>
    </g>
    <g transform="translate(40, 0)">
      <rect x="0" y="0" width="72" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <text x="36" y="15" text-anchor="middle" fill="#00FF88">🎵 Vibe</text>
    </g>
  </g>
</svg>
