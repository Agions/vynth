<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7DCFFF"/>
      <stop offset="100%" style="stop-color:#7B61FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" ry="108" fill="#0D1117"/>

  <!-- Outer ring -->
  <circle cx="256" cy="220" r="160" fill="none" stroke="url(#g1)" stroke-width="1.2" opacity="0.18" filter="url(#glow)"/>

  <!-- Central mark: ◆ Synerix -->
  <g transform="translate(256, 210)">
    <!-- Diamond -->
    <path d="M0,-70 L40,0 L0,70 L-40,0 Z" fill="none" stroke="url(#g1)" stroke-width="3.5" opacity="0.9"/>
    <!-- Inner cross -->
    <path d="M0,-45 L0,45 M-25,0 L25,0" stroke="url(#g1)" stroke-width="2" opacity="0.6"/>

    <!-- SYNERIX wordmark -->
    <text x="0" y="110" text-anchor="middle"
          font-family="'SF Pro Display','Inter','Segoe UI',system-ui,sans-serif"
          font-size="46" font-weight="800" letter-spacing="10" fill="white">
      SYNERIX
    </text>

    <!-- Tagline -->
    <text x="0" y="142" text-anchor="middle"
          font-family="'JetBrains Mono','Fira Code','SF Mono',monospace"
          font-size="13" letter-spacing="5" fill="#8B949E">
      AI-NATIVE CODING TERMINAL
    </text>
  </g>
</svg>
