<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B61FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B9D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7B61FF;stop-opacity:0.1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0D1117"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" clip-path="url(#rounded)">
    <line x1="0" y1="64" x2="512" y2="64" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="128" x2="512" y2="128" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="192" x2="512" y2="192" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="320" x2="512" y2="320" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="448" x2="512" y2="448" stroke="#fff" stroke-width="1"/>
    <line x1="64" y1="0" x2="64" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="192" y1="0" x2="192" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="448" y1="0" x2="448" y2="512" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Terminal cursor accent -->
  <g filter="url(#glow)">
    <!-- S letterform - geometric/modern -->
    <path d="M160 160 L280 160 L280 200 L200 200 L200 240 L280 240 L280 352 L160 352 L160 312 L240 312 L240 272 L160 272 Z"
          fill="url(#grad1)" opacity="0.95"/>

    <!-- X letterform - crossing lines -->
    <path d="M300 160 L340 160 L392 240 L444 160 L484 160 L412 272 L484 384 L444 384 L392 304 L340 384 L300 384 L372 272 Z"
          fill="url(#grad1)" opacity="0.95"/>

    <!-- Connecting arc between S and X -->
    <path d="M284 256 Q292 256 296 256" stroke="url(#grad1)" stroke-width="3" fill="none" opacity="0.6"/>
  </g>

  <!-- Terminal prompt indicator -->
  <g opacity="0.7">
    <rect x="80" y="400" width="6" height="24" rx="3" fill="#00D4FF">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="422" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" fill="#8B949E">
      synerix v0.0.1
    </text>
  </g>

  <!-- Subtle corner accents -->
  <path d="M96 48 L48 48 L48 96" stroke="url(#grad1)" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M416 464 L464 464 L464 416" stroke="url(#grad1)" stroke-width="2" fill="none" opacity="0.4"/>
</svg>